[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llamaindex-anakin"
version = "0.1.0"
description = "LlamaIndex integration for Anakin API - web scraping, AI search, and intelligent data extraction workflows"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anakin AI", email = "anakin@anakininc.com"}
]
keywords = [
    "llamaindex",
    "anakin",
    "web scraping",
    "ai search",
    "perplexity",
    "data extraction",
    "agentic search",
    "workflows"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "llama-index-workflows>=2.5.0,<3.0.0",
    "llama-index-core>=0.12.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/llamaindex-anakin"
"Bug Tracker" = "https://github.com/Anakin-Inc/llamaindex-anakin/issues"

[dependency-groups]
dev = [
    "hatch>=1.14.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.2",
    "ty>=0.0.2",
]

[tool.hatch.envs.default.scripts]
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check --fix ."
lint-check = ["ruff check ."]
typecheck = "ty check src"
test = "pytest"
all-check = ["format-check", "lint-check", "test"]
all-fix = ["format", "lint", "test"]

[tool.llamadeploy]
env_files = [".env"]

[tool.llamadeploy.workflows]
scrape = "llamaindex_anakin.workflows.scrape_workflow:scrape_workflow"
search = "llamaindex_anakin.workflows.search_workflow:search_workflow"
agentic-search = "llamaindex_anakin.workflows.agentic_search_workflow:agentic_search_workflow"
