[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-anakin"
version = "0.1.0"
description = "LlamaIndex tools for Anakin: web scraping, search, deep research, Wire site actions, monitors and browser tasks"
authors = [{name = "Anakin", email = "support@anakin.io"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
keywords = ["llama-index", "anakin", "web scraping", "agents", "tools", "search", "crawl"]
dependencies = [
    "anakin-sdk>=0.2.0,<0.3",
    "httpx>=0.27,<1",
    "llama-index-core>=0.13.0,<0.15",
]

[project.urls]
Homepage = "https://anakin.io"
Documentation = "https://anakin.io/docs"
Repository = "https://github.com/Anakin-Inc/llamaindex-anakin"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.10",
]

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.anakin"

[tool.llamahub.class_authors]
AnakinToolSpec = "Anakin-Inc"

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-third-party = ["anakin"]
